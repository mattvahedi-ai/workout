<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Troy" />
  <meta name="theme-color" content="#f4f1ec" />
  <meta name="format-detection" content="telephone=no" />

  <title>Troy Workout Log</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230a0a0a'/%3E%3Ctext x='90' y='118' text-anchor='middle' font-family='Courier' font-size='72' font-weight='900' fill='%23ffffff'%3EVB%3C/text%3E%3Cline x1='40' y1='138' x2='140' y2='138' stroke='%23d63b1f' stroke-width='4'/%3E%3C/svg%3E" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f1ec; }
    body {
      font-family: 'Courier New', Courier, monospace;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; cursor: pointer; }
    input, textarea { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; -webkit-appearance: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #f4f1ec; }
    ::-webkit-scrollbar-thumb { background: #c8c0b0; border-radius: 2px; }

    /* App-wide */
    .app { background: #f4f1ec; min-height: 100vh; padding-bottom: 90px; }

    /* Header */
    .header { padding: 24px 20px 16px; padding-top: calc(24px + env(safe-area-inset-top)); border-bottom: 1px solid #d9d3c8; position: sticky; top: 0; background: #f4f1ec; z-index: 100; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .brand { font-size: 10px; letter-spacing: 4px; color: #888; margin-bottom: 2px; }
    .title { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #111; }
    .save-tag { font-size: 9px; letter-spacing: 1.5px; font-weight: 700; margin-top: 4px; color: #999; transition: color 0.3s; white-space: nowrap; }
    .header-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .header-btn { background: #111; color: #fff; border: none; border-radius: 2px; padding: 8px 12px; font-size: 10px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; }

    /* Tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 3px; }
    .tab { position: relative; border: 1px solid #d9d3c8; border-radius: 2px; padding: 6px 10px; font-size: 10px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; background: transparent; color: #999; transition: all 0.15s; }
    .tab.active { color: #fff; }
    .tab .today-dot { position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: #d63b1f; border: 1px solid #f4f1ec; }

    /* Day header */
    .day-section { padding: 20px 20px 0; }
    .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .day-tag { font-size: 9px; letter-spacing: 3px; padding: 3px 8px; border-radius: 2px; border: 1px solid; }
    .day-label { font-size: 20px; font-weight: 900; letter-spacing: 3px; color: #111; }
    .day-set-count { font-size: 10px; color: #888; }
    .day-focus { font-size: 10px; letter-spacing: 2px; color: #888; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; }

    /* Exercises */
    .ex-list { padding: 0 20px 40px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #fff; border: 1px solid #d9d3c8; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,0.02); }
    .ex-header { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #ece7de; gap: 8px; background: #faf7f2; }
    .ex-num { font-size: 10px; font-weight: 700; color: #aaa; min-width: 20px; }
    .ex-name { flex: 1; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #222; text-transform: uppercase; }
    .ex-name-input { flex: 1; background: #fff; border: 1px solid; color: #111; font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 4px 8px; border-radius: 2px; outline: none; min-width: 0; }
    .icon-btn { background: transparent; border: none; color: #bbb; font-size: 14px; padding: 0 4px; line-height: 1; }
    .rx-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 10px; letter-spacing: 0.5px; color: #555; border-bottom: 1px solid #ece7de; }
    .rx-row .rx { font-weight: 800; color: #222; }
    .rx-row .last { color: #999; font-size: 9px; margin-left: auto; text-align: right; }
    .rest-btn { background: transparent; border: 1px solid #d9d3c8; border-radius: 2px; color: #666; font-size: 9px; font-weight: 800; letter-spacing: 1px; padding: 3px 6px; white-space: nowrap; }
    .target-banner { display: flex; align-items: center; padding: 8px 14px; font-size: 10px; letter-spacing: 0.5px; border-bottom: 1px solid; }
    .target-banner .label { font-weight: 700; opacity: 0.8; }
    .target-banner .val { font-weight: 900; margin-left: 6px; font-size: 12px; }
    .target-banner .hint { margin-left: auto; font-size: 8px; opacity: 0.75; font-weight: 700; white-space: nowrap; padding-left: 6px; }

    /* Sets table */
    .col-headers { display: grid; grid-template-columns: 32px 1fr 1fr 32px; gap: 6px; padding: 8px 14px 6px; align-items: center; background: #fbf9f5; border-bottom: 1px solid #ece7de; }
    .col-headers .h1 { font-size: 8px; color: #888; letter-spacing: 2px; font-weight: 700; }
    .col-headers .h { font-size: 9px; color: #444; letter-spacing: 2px; text-align: center; font-weight: 800; }
    .set-row { display: grid; grid-template-columns: 32px 1fr 1fr 32px; gap: 6px; padding: 6px 14px; align-items: center; }
    .set-row.bordered { border-bottom: 1px solid #f4efe6; }
    .set-num { font-size: 10px; font-weight: 800; }
    .num-input { background: #faf7f2; border: 1px solid #e0d9cc; border-radius: 2px; color: #111; font-size: 14px; font-weight: 700; padding: 7px 8px; text-align: center; outline: none; width: 100%; transition: all 0.15s; }
    .num-input:focus { background: #fff; }
    .remove-set-btn { background: transparent; border: none; color: #ccc; font-size: 18px; padding: 0; line-height: 1; text-align: center; }
    .add-set-wrap { padding: 10px 14px 12px; }
    .add-set-btn { background: transparent; border: 1px dashed #c8c0b0; border-radius: 2px; color: #888; font-size: 9px; letter-spacing: 2px; padding: 6px 0; width: 100%; font-weight: 700; transition: all 0.15s; }
    .add-ex-btn { background: transparent; border: 1px dashed #c8c0b0; border-radius: 4px; color: #888; font-size: 10px; letter-spacing: 3px; padding: 16px; width: 100%; font-weight: 700; transition: all 0.15s; }

    /* New exercise form */
    .new-ex-card { background: #fff; border: 1px solid; border-radius: 4px; padding: 14px; }
    .new-ex-label { font-size: 9px; letter-spacing: 3px; margin-bottom: 10px; font-weight: 800; }
    .new-ex-input { background: #faf7f2; border: 1px solid; border-radius: 2px; color: #111; font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 9px 12px; width: 100%; outline: none; margin-bottom: 10px; text-transform: uppercase; }
    .new-ex-buttons { display: flex; gap: 8px; }
    .primary-btn { flex: 1; border: none; border-radius: 2px; color: #fff; font-size: 10px; font-weight: 900; letter-spacing: 2px; padding: 9px; }
    .secondary-btn { flex: 1; background: transparent; border: 1px solid #d9d3c8; border-radius: 2px; color: #888; font-size: 10px; font-weight: 700; letter-spacing: 2px; padding: 9px; }
    .wide-btn { width: 100%; flex: none; padding: 14px; font-size: 11px; }

    /* Notes / text panels */
    .panel { background: #fff; border: 1px solid #d9d3c8; border-radius: 4px; padding: 14px; }
    .panel-label { font-size: 9px; letter-spacing: 3px; font-weight: 800; color: #888; margin-bottom: 10px; }
    .notes-input { width: 100%; min-height: 70px; background: #faf7f2; border: 1px solid #e0d9cc; border-radius: 2px; font-size: 12px; padding: 8px 10px; color: #222; resize: vertical; outline: none; }
    .notes-input:focus { background: #fff; border-color: #999; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 9px; letter-spacing: 2px; font-weight: 800; color: #555; margin-bottom: 4px; }
    .field input { width: 100%; background: #faf7f2; border: 1px solid #e0d9cc; border-radius: 2px; font-size: 13px; font-weight: 700; padding: 8px 10px; color: #111; outline: none; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Cardio / recovery */
    .goal-row { padding: 9px 14px 10px; border-bottom: 1px solid #ece7de; cursor: pointer; }
    .goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 9px; letter-spacing: 1px; font-weight: 800; color: #555; margin-bottom: 5px; }
    .goal-top .pct { font-size: 11px; font-weight: 900; white-space: nowrap; }
    .goal-bar { height: 6px; background: #ece7de; border-radius: 3px; overflow: hidden; }
    .goal-bar > div { height: 100%; border-radius: 3px; }
    .goal-set { font-size: 9px; letter-spacing: 1.5px; font-weight: 800; color: #999; }
    .cardio-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 14px 14px; }
    .cardio-head { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 14px 0; }
    .cardio-head div { font-size: 9px; color: #444; letter-spacing: 2px; text-align: center; font-weight: 800; }
    .list { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.7; color: #333; }
    .done-chip { display: inline-block; font-size: 9px; letter-spacing: 1.5px; font-weight: 800; padding: 3px 8px; border-radius: 2px; background: #e6f5ec; color: #0e7c47; border: 1px solid #9ed4b3; }

    /* Plan tab */
    .week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .week-cell { border: 1px solid #e0d9cc; border-radius: 2px; padding: 8px 2px; text-align: center; background: #faf7f2; cursor: pointer; }
    .week-cell .d { font-size: 9px; font-weight: 900; letter-spacing: 0.5px; white-space: nowrap; }
    .week-cell .c { font-size: 9px; font-weight: 800; color: #0e7c47; margin-top: 4px; height: 12px; white-space: nowrap; }
    .week-cell.next { border-color: #d63b1f; }
    .entry { border-top: 1px solid #ece7de; padding: 10px 0; font-size: 11px; color: #333; line-height: 1.5; }
    .entry:first-of-type { border-top: none; }
    .entry-head { display: flex; justify-content: space-between; align-items: center; font-weight: 900; letter-spacing: 1px; font-size: 11px; color: #111; margin-bottom: 4px; }
    .entry-k { color: #888; font-size: 9px; letter-spacing: 1px; font-weight: 800; }
    .empty { font-size: 11px; color: #999; }

    /* Rest timer bar */
    .rest-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; background: #111; color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .rest-bar .lbl { font-size: 9px; letter-spacing: 3px; font-weight: 800; color: #aaa; }
    .rest-bar .clock { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
    .rest-bar .rb { margin-left: auto; background: transparent; color: #fff; border: 1px solid #555; border-radius: 2px; font-size: 10px; font-weight: 900; letter-spacing: 2px; padding: 8px 10px; }
    .rest-bar.done { background: #0e9f6e; }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { background: #f4f1ec; border-radius: 4px; width: 100%; max-width: 460px; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid #d9d3c8; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 18px 12px; border-bottom: 1px solid #d9d3c8; }
    .modal-close { background: transparent; border: none; font-size: 22px; color: #888; line-height: 1; padding: 0; width: 28px; height: 28px; }
    .modal-body { padding: 16px; overflow: auto; flex: 1; }
    .modal-help { font-size: 11px; color: #555; line-height: 1.5; margin: 0 0 12px 0; }
    .copy-btn { width: 100%; padding: 14px; font-size: 12px; margin-bottom: 12px; }
    .export-textarea { width: 100%; min-height: 180px; max-height: 40vh; background: #fff; border: 1px solid #d9d3c8; border-radius: 2px; font-family: 'Courier New', monospace; font-size: 10px; padding: 10px; color: #333; resize: vertical; outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    'use strict';

    // =========================================================================
    // CONFIG
    // =========================================================================
    var STORAGE_KEY = 'vahedi-troy-v1';   // separate from the old 'vahedi-workout-v1' log
    var PLAN_ID = 'troy';
    var SAVE_DEBOUNCE_MS = 200;
    var REST_COMPOUND = 120;  // "Rest 2 minutes between compound sets"
    var REST_ISOLATION = 90;  // "Rest 60–90 seconds between isolation sets"

    var TYPE_COLORS = {
      upper:    '#7c3aed',
      lower:    '#c2531c',
      cardio:   '#0e9f6e',
      recovery: '#6b7280',
      plan:     '#111111',
    };

    var DAY_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat']; // matches Date.getDay()

    var TRAINING_RULES = [
      'Warm up before lifting.',
      'Rest 2 minutes between compound sets.',
      'Rest 60–90 seconds between isolation sets.',
      'Finish most sets with 1–3 reps in reserve.',
      'Increase weight when all sets reach the top of the rep range with good form.',
      'Keep a record of weights and reps.',
      'Prioritize shoulders, upper chest, back width, and abs.',
      'Start with reduced volume for the first 2 weeks if necessary.',
      'Adjust estimated starting weights to your actual strength. Machine weights vary.',
    ];

    // STRENGTH GOALS — what a balanced, athletic build should lift, as a multiple of
    // body weight (bwx), so goals scale with your latest weigh-in. Ratios keep the
    // body in proportion: rows ≈ incline press, pulldowns/cable rows ≈ 0.9× bench,
    // squat/RDL ≥ bench, shoulders and arms scaled to chest and back.
    // Healthy intermediate level, not elite. Weights round to the exercise's jump.
    //   { bwx: × body weight, r: reps }   — body-weight based (default)
    //   { w: lb, r: reps }                — fixed goal (bodyweight moves: added lb, 0 = BW only)
    var GOALS = {
      m1: { bwx: 0.30, r: 10 },  // Incline DB Press (each)        175 lb → 55s
      m2: { w: 0,      r: 10 },  // Pull-Ups                        10 bodyweight reps
      m3: { bwx: 0.85, r: 8  },  // Flat Bench Press                → 150
      m4: { bwx: 0.30, r: 10 },  // Chest-Supported DB Row (each)   → 55s
      m5: { bwx: 0.10, r: 12 },  // DB Lateral Raises (each)        → 17.5s
      m6: { bwx: 0.17, r: 10 },  // DB Biceps Curls (each)          → 30s
      t1: { bwx: 1.00, r: 8  },  // Barbell Squats                  → 175
      t2: { bwx: 1.00, r: 10 },  // Romanian Deadlifts              → 175
      t3: { bwx: 0.17, r: 10 },  // Walking Lunges (each)           → 30s
      t4: { bwx: 0.55, r: 12 },  // Seated Leg Curls                → 95
      t6: { w: 0,      r: 15 },  // Hanging Leg Raises              15 reps
      h1: { bwx: 0.20, r: 10 },  // Seated DB Shoulder Press (each) → 35s
      h2: { bwx: 0.75, r: 10 },  // Lat Pulldowns                   → 130
      h3: { w: 0,      r: 12 },  // Chest Dips                      12 bodyweight reps
      h4: { bwx: 0.75, r: 10 },  // Seated Cable Rows               → 130
      h5: { bwx: 0.08, r: 12 },  // Cable Lateral Raises (per side) → 15
      h6: { bwx: 0.10, r: 15 },  // Rear Delt Flyes (each)          → 17.5s
      h7: { bwx: 0.17, r: 10 },  // Hammer Curls (each)             → 30s
      h8: { bwx: 0.35, r: 12 },  // Triceps Pushdowns               → 60
      s1: { bwx: 1.25, r: 12 },  // Leg Press (added plates)        → 220
      s2: { bwx: 0.17, r: 10 },  // Bulgarian Split Squats (each)   → 30s
      s3: { bwx: 1.15, r: 10 },  // Barbell Hip Thrusts             → 200
      s4: { bwx: 0.55, r: 12 },  // Leg Curls                       → 95
      s5: { bwx: 0.50, r: 15 },  // Seated Calf Raises (added)      → 90
      s6: { bwx: 0.40, r: 15 },  // Cable Crunches                  → 70
      // t5 Standing Calf Raises: machine-dependent — set your own goal in the app
    };
    var GOALS_VERSION = 3;
    // Earlier default goals, so saved data still on them moves to the new ones
    // (goals you edited yourself are left alone).
    var OLD_DEFAULT_GOALS = [
      { m1:'70x10', m2:'25x8', m3:'205x8', m4:'75x10', m5:'25x15', m6:'40x10',
        t1:'245x8', t2:'225x10', t3:'50x10', t4:'130x12', t6:'0x15', h1:'60x10', h2:'180x10',
        h3:'45x10', h4:'180x12', h5:'20x15', h6:'25x15', h7:'45x10', h8:'80x12', s1:'360x12',
        s2:'50x10', s3:'275x10', s4:'130x12', s5:'135x15', s6:'100x15' },
      { m1:'50x10', m2:'0x10', m3:'155x10', m4:'55x12', m5:'17.5x15', m6:'30x12',
        t1:'155x10', t2:'145x10', t3:'30x10', t4:'90x12', t6:'0x15', h1:'40x10', h2:'130x12',
        h3:'0x12', h4:'130x12', h5:'15x15', h6:'17.5x15', h7:'30x12', h8:'55x12', s1:'180x12',
        s2:'30x10', s3:'185x12', s4:'90x12', s5:'90x15', s6:'70x15' },
    ];
    var DEFAULT_BODYWEIGHT = 175;

    // ex(id, name, repLo, repHi, startWeight, rxText, opts)
    //   opts.c   = compound (2 min rest) — otherwise isolation (90 s)
    //   opts.inc = weight jump when all sets hit the top of the range
    //   opts.bw  = bodyweight movement (weight field = added load, blank = BW)
    function ex(id, name, lo, hi, w, rx, opts) {
      opts = opts || {};
      var sets = [];
      for (var i = 0; i < 3; i++) sets.push({ w: w, r: lo });
      return { id: id, name: name, lo: lo, hi: hi, rx: rx, c: !!opts.c, inc: opts.inc || 5, bw: !!opts.bw, unit: opts.unit || '', goal: GOALS[id] ? clone(GOALS[id]) : null, sets: sets };
    }

    // Starting treadmill settings for each cardio day (editable in the app)
    var CARDIO_DEFAULT = { mph: 3.0, incline: 5, min: 20 };
    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    var INITIAL_DATA = {
      plan: PLAN_ID,
      version: 1,
      days: [
        { id: 'mon', tag: 'MON', label: 'UPPER A', focus: 'Chest & Back', type: 'upper', notes: '', exercises: [
          ex('m1', 'Incline DB Press',         8, 10,  35,   '3 × 8–10 @ 35 lb each',            { c: true, unit: 'EACH' }),
          ex('m2', 'Pull-Ups',                 6, 10,  0,    '3 × 6–10 @ Bodyweight/Assisted',   { c: true, bw: true }),
          ex('m3', 'Flat Bench Press',         8, 10,  105,  '3 × 8–10 @ 105 lb',                { c: true }),
          ex('m4', 'Chest-Supported DB Row',   8, 12,  40,   '3 × 8–12 @ 40 lb each',            { c: true, unit: 'EACH' }),
          ex('m5', 'DB Lateral Raises',        12, 15, 12.5, '3 × 12–15 @ 12.5 lb each',         { inc: 2.5, unit: 'EACH' }),
          ex('m6', 'DB Biceps Curls',          10, 12, 20,   '3 × 10–12 @ 20 lb each',           { unit: 'EACH' }),
        ]},
        { id: 'tue', tag: 'TUE', label: 'LOWER A', focus: 'Legs & Abs', type: 'lower', notes: '', exercises: [
          ex('t1', 'Barbell Squats',           6, 10,  95,   '3 × 6–10 @ 95 lb',                 { c: true }),
          ex('t2', 'Romanian Deadlifts',       8, 10,  95,   '3 × 8–10 @ 95 lb',                 { c: true }),
          ex('t3', 'Walking Lunges',           10, 10, 15,   '3 × 10/leg @ 15 lb each',          { c: true, unit: 'EACH' }),
          ex('t4', 'Seated Leg Curls',         10, 12, 60,   '3 × 10–12 @ 60 lb'),
          ex('t5', 'Standing Calf Raises',     12, 15, 0,    '3 × 12–15 @ Machine-dependent',    { inc: 10 }),
          ex('t6', 'Hanging Leg Raises',       10, 15, 0,    '3 × 10–15 @ Bodyweight',           { bw: true }),
        ]},
        { id: 'wed', tag: 'WED', label: 'CARDIO', focus: 'Treadmill Incline Walking', type: 'cardio', cardio: clone(CARDIO_DEFAULT) },
        { id: 'thu', tag: 'THU', label: 'UPPER B', focus: 'Shoulders, Back & Arms', type: 'upper', notes: '', exercises: [
          ex('h1', 'Seated DB Shoulder Press', 8, 10,  25,   '3 × 8–10 @ 25 lb each',            { c: true, unit: 'EACH' }),
          ex('h2', 'Lat Pulldowns',            10, 12, 90,   '3 × 10–12 @ 90 lb',                { c: true }),
          ex('h3', 'Chest Dips',               8, 12,  0,    '3 × 8–12 @ Bodyweight/Assisted',   { c: true, bw: true }),
          ex('h4', 'Seated Cable Rows',        10, 12, 90,   '3 × 10–12 @ 90 lb',                { c: true }),
          ex('h5', 'Cable Lateral Raises',     12, 15, 10,   '3 × 12–15 @ 10 lb/side',           { inc: 2.5, unit: 'SIDE' }),
          ex('h6', 'Rear Delt Flyes',          12, 15, 12.5, '3 × 12–15 @ 12.5 lb each',         { inc: 2.5, unit: 'EACH' }),
          ex('h7', 'Hammer Curls',             10, 12, 20,   '3 × 10–12 @ 20 lb each',           { unit: 'EACH' }),
          ex('h8', 'Triceps Pushdowns',        10, 12, 35,   '3 × 10–12 @ 35 lb'),
        ]},
        { id: 'fri', tag: 'FRI', label: 'RECOVERY', focus: 'Rest & Mobility', type: 'recovery' },
        { id: 'sat', tag: 'SAT', label: 'LOWER B', focus: 'Legs, Glutes & Abs', type: 'lower', notes: '', exercises: [
          ex('s1', 'Leg Press',                10, 12, 90,   '3 × 10–12 @ 90 lb added plates',   { c: true, inc: 10 }),
          ex('s2', 'Bulgarian Split Squats',   8, 10,  15,   '3 × 8–10 @ 15 lb each',            { c: true, unit: 'EACH' }),
          ex('s3', 'Barbell Hip Thrusts',      8, 12,  115,  '3 × 8–12 @ 115 lb',                { c: true, inc: 10 }),
          ex('s4', 'Leg Curls',                10, 12, 60,   '3 × 10–12 @ 60 lb'),
          ex('s5', 'Seated Calf Raises',       12, 15, 45,   '3 × 12–15 @ 45 lb added plates',   { inc: 10 }),
          ex('s6', 'Cable Crunches',           12, 15, 45,   '3 × 12–15 @ 45 lb'),
        ]},
        { id: 'sun', tag: 'SUN', label: 'CARDIO', focus: 'Treadmill Incline Walking', type: 'cardio', cardio: clone(CARDIO_DEFAULT) },
      ],
      history: [], // { date, dayId, label, items?: [{ exId, name, sets }] }
      weeks: [],   // weekly progress tracker entries
    };

    // =========================================================================
    // HELPERS
    // =========================================================================
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function todayISO() { return isoDate(new Date()); }
    function todayDayId() { return DAY_ORDER[new Date().getDay()]; }
    function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function mondayOf(d) {
      var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      var diff = (m.getDay() + 6) % 7; // days since Monday
      m.setDate(m.getDate() - diff);
      return m;
    }
    function shortDate(iso) {
      var M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      var d = parseISO(iso);
      return M[d.getMonth()] + ' ' + d.getDate();
    }
    function fmtClock(sec) { return Math.floor(sec / 60) + ':' + pad2(sec % 60); }
    function num(v) { return isFinite(Number(v)) && v !== '' ? Number(v) : 0; }

    // Workout name used for tabs/headers; repeated names get numbered (CARDIO 1, CARDIO 2)
    function tabLabel(day) {
      var same = STATE.data.days.filter(function(d){ return d.label === day.label; });
      return same.length > 1 ? day.label + ' ' + (same.indexOf(day) + 1) : day.label;
    }

    function findDay(dayId) { return STATE.data.days.find(function(d){ return d.id === dayId; }); }
    function findEx(dayId, exId) { return findDay(dayId).exercises.find(function(x){ return x.id === exId; }); }

    // Progression rule from the plan: increase weight once ALL sets reach the
    // top of the rep range (with good form). Otherwise, build reps first.
    function getProgression(e) {
      if (!e.sets || !e.sets.length) return null;
      var workW = Math.max.apply(null, e.sets.map(function(s){ return num(s.w); }));
      var atTop = e.sets.filter(function(s){ return num(s.w) >= workW && num(s.r) >= e.hi; }).length;
      var total = e.sets.length;
      if (workW === 0 && !e.bw) {
        return { ready: false, text: 'ENTER YOUR WORKING WEIGHT', hint: e.hi + ' REPS' };
      }
      if (atTop === total) {
        if (workW === 0) {
          return { ready: true, text: 'ADD LOAD / LESS ASSIST', hint: 'ALL SETS AT ' + e.hi };
        }
        return { ready: true, text: (workW + e.inc) + ' LBS × ' + e.lo, hint: 'ADD WEIGHT' };
      }
      return {
        ready: false,
        text: (workW > 0 ? workW + ' LBS × ' : '') + e.hi + ' ALL SETS',
        hint: atTop + '/' + total + ' AT TOP',
      };
    }

    function lastLogFor(exId) {
      var h = STATE.data.history;
      for (var i = h.length - 1; i >= 0; i--) {
        var items = h[i].items || [];
        for (var j = 0; j < items.length; j++) {
          if (items[j].exId === exId) return { date: h[i].date, sets: items[j].sets };
        }
      }
      return null;
    }

    // ---- Strength goal progress ----------------------------------------------
    // Compares your best set's estimated 1-rep max (Epley) to the goal set's,
    // so 185×10 and 205×8 are compared fairly.
    function e1rm(load, reps) { return load * (1 + reps / 30); }
    function currentBodyWeight() {
      var w = STATE.data.weeks.find(function(x){ return num(x.bodyWeight) > 0; }); // weeks are newest-first
      return w ? num(w.bodyWeight) : DEFAULT_BODYWEIGHT;
    }
    // Goal weight in lb: body-weight based goals round to the exercise's weight jump
    function goalWeight(e) {
      var g = e.goal;
      if (g.bwx == null) return num(g.w);
      var inc = e.inc || 5;
      return Math.round(g.bwx * currentBodyWeight() / inc) * inc;
    }
    function loadOf(e, w) { return (e.bw ? currentBodyWeight() : 0) + num(w); }
    function goalProgress(e) {
      if (!e.goal) return null;
      var goalE = e1rm(loadOf(e, goalWeight(e)), num(e.goal.r));
      if (goalE <= 0) return null;
      // Bodyweight-only goals (e.g. 10 pull-ups) are measured by reps: 6 of 10 = 60%.
      var repsOnly = e.bw && goalWeight(e) === 0;
      var ratio = Math.max.apply(null, [0].concat(e.sets.map(function(s) {
        if (num(s.r) <= 0) return 0;
        if (repsOnly && num(s.w) === 0) return num(s.r) / num(e.goal.r);
        return e1rm(loadOf(e, s.w), num(s.r)) / goalE;
      })));
      var pct = Math.round(ratio * 100);
      return { pct: pct, capped: Math.min(pct, 100) };
    }
    function goalColor(pct) {
      return pct >= 100 ? '#0e9f6e' : pct >= 80 ? '#3f9e5a' : pct >= 60 ? '#cc8a00' : '#d63b1f';
    }
    function goalText(e) {
      var g = e.goal, u = e.unit ? ' ' + e.unit : '', w = goalWeight(e);
      if (e.bw) return (w > 0 ? 'BW+' + w : 'BW') + ' × ' + g.r;
      return w + ' LB' + u + ' × ' + g.r;
    }
    function goalBar(pct) {
      return '<div class="goal-bar"><div style="width:' + Math.min(pct, 100) + '%;background:' + goalColor(pct) + '"></div></div>';
    }
    function lastCardioFor(dayId) {
      var h = STATE.data.history;
      for (var i = h.length - 1; i >= 0; i--) {
        if (h[i].dayId === dayId && h[i].cardio) return { date: h[i].date, cardio: h[i].cardio };
      }
      return null;
    }

    function loggedOn(dayId, iso) {
      return STATE.data.history.some(function(h){ return h.dayId === dayId && h.date === iso; });
    }

    function normalize(data) {
      data.history = Array.isArray(data.history) ? data.history : [];
      data.weeks = Array.isArray(data.weeks) ? data.weeks : [];
      data.days.forEach(function(d) {
        if (d.type === 'cardio') {
          var c = d.cardio || clone(CARDIO_DEFAULT);
          d.cardio = {
            mph: c.mph === '' ? '' : num(c.mph),
            incline: c.incline === '' ? '' : num(c.incline),
            min: c.min === '' ? '' : num(c.min),
          };
        }
        if (!d.exercises) return;
        d.exercises.forEach(function(e) {
          var key = e.goal && e.goal.bwx == null ? e.goal.w + 'x' + e.goal.r : null;
          var oldDefault = key && OLD_DEFAULT_GOALS.some(function(o){ return o[e.id] === key; });
          if (e.goal === undefined || ((data.goalsVersion || 1) < GOALS_VERSION && oldDefault)) {
            e.goal = GOALS[e.id] ? clone(GOALS[e.id]) : null;
          }
          e.sets = (e.sets || []).map(function(s) {
            return { w: s.w === '' ? '' : num(s.w), r: s.r === '' ? '' : num(s.r) };
          });
        });
      });
      data.goalsVersion = GOALS_VERSION;
      return data;
    }

    // =========================================================================
    // STORAGE
    // =========================================================================
    function loadData() {
      try {
        var json = localStorage.getItem(STORAGE_KEY);
        if (!json) return null;
        var d = JSON.parse(json);
        return d && d.plan === PLAN_ID && Array.isArray(d.days) ? normalize(d) : null;
      } catch (e) { return null; }
    }
    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (e) { return false; }
    }

    // =========================================================================
    // STATE
    // =========================================================================
    var STATE = {
      data: loadData() || clone(INITIAL_DATA),
      activeDay: null, // set at init: last workout logged
      editingName: null,
      adding: false,
      newExName: '',
      exportText: null,
      copyStatus: 'idle',
      saveStatus: 'idle',
      flash: null,
      weekDraft: null,
      rest: null, // { end, total }
    };

    function blankWeekDraft() {
      return { weekOf: isoDate(mondayOf(new Date())), bodyWeight: '', waist: '', strength: '', energy: '', adjustments: '' };
    }

    // =========================================================================
    // SAVE
    // =========================================================================
    var saveTimer = null, saveStatusTimer = null;
    function scheduleSave() {
      STATE.saveStatus = 'saving';
      updateSaveIndicator();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function() {
        var ok = saveData(STATE.data);
        STATE.saveStatus = ok ? 'saved' : 'error';
        updateSaveIndicator();
        clearTimeout(saveStatusTimer);
        if (ok) {
          saveStatusTimer = setTimeout(function() {
            if (STATE.saveStatus === 'saved') {
              STATE.saveStatus = 'idle';
              updateSaveIndicator();
            }
          }, 1500);
        }
      }, SAVE_DEBOUNCE_MS);
    }

    function updateSaveIndicator() {
      var el = document.getElementById('save-status');
      if (!el) return;
      var labels = { idle: '● SYNCED', saving: '● SAVING', saved: '● SAVED', error: '● ERROR' };
      var colors = { idle: '#999', saving: '#999', saved: '#0e9f6e', error: '#d63b1f' };
      el.textContent = labels[STATE.saveStatus];
      el.style.color = colors[STATE.saveStatus];
    }

    // =========================================================================
    // REST TIMER
    // =========================================================================
    var restTick = null;
    function updateRestBar() {
      var bar = document.getElementById('rest-bar');
      if (!STATE.rest) { if (bar) bar.parentNode.removeChild(bar); return; }
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'rest-bar';
        bar.className = 'rest-bar';
        bar.innerHTML = '<div><div class="lbl">REST</div><div class="clock" id="rest-clock"></div></div>' +
          '<button class="rb" onclick="app.addRest(30)">+30S</button>' +
          '<button class="rb" style="margin-left:0" onclick="app.stopRest()">DONE</button>';
        document.body.appendChild(bar);
      }
      var left = Math.max(0, Math.round((STATE.rest.end - Date.now()) / 1000));
      document.getElementById('rest-clock').textContent = left > 0 ? fmtClock(left) : 'GO';
      if (left === 0 && !bar.classList.contains('done')) {
        bar.classList.add('done');
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
      } else if (left > 0) {
        bar.classList.remove('done');
      }
    }

    // =========================================================================
    // ACTIONS (exposed globally for inline handlers)
    // =========================================================================
    window.app = {
      setActiveDay: function(day) {
        STATE.activeDay = day;
        STATE.adding = false;
        STATE.editingName = null;
        STATE.flash = null;
        render();
        window.scrollTo(0, 0);
      },

      updateCardio: function(dayId, field, value) {
        findDay(dayId).cardio[field] = value === '' ? '' : Number(value);
        scheduleSave();
        // No re-render — preserve input focus
      },

      updateSet: function(dayId, exId, idx, field, value) {
        findEx(dayId, exId).sets[idx][field] = value === '' ? '' : Number(value);
        scheduleSave();
        // No re-render — preserve input focus
      },

      refreshAfterEdit: function() {
        // Defer so tapping straight into the next input keeps working
        setTimeout(function() {
          var a = document.activeElement;
          if (a && a.classList && a.classList.contains('num-input')) return;
          render();
        }, 0);
      },

      addSet: function(dayId, exId) {
        var e = findEx(dayId, exId);
        var last = e.sets[e.sets.length - 1] || { w: 0, r: e.lo || 10 };
        e.sets.push({ w: last.w, r: last.r });
        scheduleSave();
        render();
      },

      removeSet: function(dayId, exId, idx) {
        var e = findEx(dayId, exId);
        if (e.sets.length > 1) e.sets.splice(idx, 1);
        scheduleSave();
        render();
      },

      removeExercise: function(dayId, exId) {
        if (!confirm('Remove this exercise?')) return;
        var day = findDay(dayId);
        day.exercises = day.exercises.filter(function(x){ return x.id !== exId; });
        scheduleSave();
        render();
      },

      startEditName: function(exId) { STATE.editingName = exId; render(); },

      finishEditName: function(dayId, exId, name) {
        if (name.trim()) findEx(dayId, exId).name = name.trim();
        STATE.editingName = null;
        scheduleSave();
        render();
      },

      cancelEditName: function() { STATE.editingName = null; render(); },

      startAdd: function() { STATE.adding = true; STATE.newExName = ''; render(); },
      cancelAdd: function() { STATE.adding = false; STATE.newExName = ''; render(); },
      setNewExName: function(value) { STATE.newExName = value; },

      editGoal: function(dayId, exId) {
        var e = findEx(dayId, exId);
        var g = e.goal ? { w: goalWeight(e), r: e.goal.r } : { w: '', r: e.hi };
        var auto = GOALS[e.id] && GOALS[e.id].bwx != null
          ? '\nType AUTO to use the body-weight goal (' + Math.round(GOALS[e.id].bwx * 100) + '% of body weight).' : '';
        var wMsg = e.bw
          ? 'Goal for ' + e.name + ':\nAdded weight in lb (0 = bodyweight only).\nLeave empty to remove the goal.'
          : 'Goal for ' + e.name + ':\nWeight in lb' + (e.unit ? ' (' + e.unit.toLowerCase() + ')' : '') + '.\nLeave empty to remove the goal.' + auto;
        var w = prompt(wMsg, g.w);
        if (w === null) return;
        if (auto && String(w).trim().toLowerCase() === 'auto') { e.goal = clone(GOALS[e.id]); scheduleSave(); render(); return; }
        if (String(w).trim() === '') { e.goal = null; scheduleSave(); render(); return; }
        if (!isFinite(Number(w)) || Number(w) < 0) { alert('Enter a number.'); return; }
        var r = prompt('Goal reps for ' + e.name + ':', g.r);
        if (r === null) return;
        if (!isFinite(Number(r)) || Number(r) <= 0) { alert('Enter a number of reps.'); return; }
        e.goal = { w: Number(w), r: Number(r) };
        scheduleSave();
        render();
      },

      submitAdd: function(dayId) {
        var name = STATE.newExName.trim();
        if (!name) return;
        var e = ex(uid(), name, 8, 12, 0, '3 × 8–12');
        findDay(dayId).exercises.push(e);
        STATE.adding = false;
        STATE.newExName = '';
        scheduleSave();
        render();
      },

      handleKeyOnAdd: function(e, dayId) {
        if (e.key === 'Enter') { app.submitAdd(dayId); }
        else if (e.key === 'Escape') { app.cancelAdd(); }
      },

      handleKeyOnEdit: function(e) {
        if (e.key === 'Enter') { e.target.blur(); }
        else if (e.key === 'Escape') { app.cancelEditName(); }
      },

      setNotes: function(dayId, value) {
        findDay(dayId).notes = value;
        scheduleSave();
      },

      // Snapshot today's numbers into history (replaces an existing entry for the same day/date)
      logSession: function(dayId) {
        var day = findDay(dayId);
        var date = todayISO();
        var entry = { date: date, at: Date.now(), dayId: dayId, label: tabLabel(day) };
        if (day.exercises) {
          entry.items = day.exercises.map(function(e) {
            return { exId: e.id, name: e.name, sets: clone(e.sets) };
          });
        }
        if (day.cardio) entry.cardio = clone(day.cardio);
        var h = STATE.data.history.filter(function(x){ return !(x.dayId === dayId && x.date === date); });
        h.push(entry);
        h.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        STATE.data.history = h;
        STATE.flash = dayId;
        scheduleSave();
        render();
      },

      unlogSession: function(dayId) {
        var date = todayISO();
        STATE.data.history = STATE.data.history.filter(function(x){ return !(x.dayId === dayId && x.date === date); });
        STATE.flash = null;
        scheduleSave();
        render();
      },

      // Rest timer
      startRest: function(sec) {
        STATE.rest = { end: Date.now() + sec * 1000 };
        clearInterval(restTick);
        restTick = setInterval(updateRestBar, 250);
        updateRestBar();
      },
      addRest: function(sec) {
        if (!STATE.rest) return;
        STATE.rest.end = Math.max(STATE.rest.end, Date.now()) + sec * 1000;
        updateRestBar();
      },
      stopRest: function() {
        STATE.rest = null;
        clearInterval(restTick);
        updateRestBar();
      },

      // Weekly tracker
      setWeekField: function(field, value) {
        if (!STATE.weekDraft) STATE.weekDraft = blankWeekDraft();
        STATE.weekDraft[field] = value;
      },
      saveWeek: function() {
        var w = STATE.weekDraft || blankWeekDraft();
        if (!w.weekOf) { alert('Pick the week date first.'); return; }
        var weeks = STATE.data.weeks.filter(function(x){ return x.weekOf !== w.weekOf; });
        weeks.push(clone(w));
        weeks.sort(function(a, b){ return a.weekOf < b.weekOf ? 1 : -1; });
        STATE.data.weeks = weeks;
        STATE.weekDraft = null;
        scheduleSave();
        render();
      },
      editWeek: function(weekOf) {
        var w = STATE.data.weeks.find(function(x){ return x.weekOf === weekOf; });
        if (!w) return;
        STATE.weekDraft = clone(w);
        render();
        var f = document.getElementById('week-form');
        if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
      deleteWeek: function(weekOf) {
        if (!confirm('Delete the entry for week of ' + weekOf + '?')) return;
        STATE.data.weeks = STATE.data.weeks.filter(function(x){ return x.weekOf !== weekOf; });
        scheduleSave();
        render();
      },

      resetPlan: function() {
        if (!confirm('Reset all exercises back to the plan\'s starting weights? History and weekly entries are kept.')) return;
        var fresh = clone(INITIAL_DATA);
        fresh.history = STATE.data.history;
        fresh.weeks = STATE.data.weeks;
        STATE.data = fresh;
        scheduleSave();
        render();
      },

      exportData: function() {
        var json = JSON.stringify(STATE.data, null, 2);
        try {
          var blob = new Blob([json], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'troy-workout-' + todayISO() + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        } catch (e) {}
        // Always show the modal too as a copy-fallback
        STATE.exportText = json;
        STATE.copyStatus = 'idle';
        render();
      },

      closeModal: function() { STATE.exportText = null; render(); },

      copyExport: function() {
        var done = function(success) {
          STATE.copyStatus = success ? 'copied' : 'failed';
          render();
          setTimeout(function() {
            if (STATE.copyStatus !== 'idle') { STATE.copyStatus = 'idle'; render(); }
          }, 2200);
        };
        var fallback = function() {
          var ta = document.getElementById('export-textarea');
          if (!ta) return done(false);
          ta.focus(); ta.select();
          try { done(document.execCommand('copy')); } catch (e) { done(false); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(STATE.exportText).then(function(){ done(true); }, fallback);
        } else { fallback(); }
      },

      triggerImport: function() { document.getElementById('import-input').click(); },

      handleImport: function(input) {
        var file = input.files && input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var parsed = JSON.parse(e.target.result);
            if (!parsed.days || !Array.isArray(parsed.days)) throw new Error('Not a valid workout log');
            if (parsed.plan !== PLAN_ID) throw new Error('This backup is from the old Push/Pull/Legs log, not the Troy plan');
            if (confirm('Replace your current data with this backup?')) {
              STATE.data = normalize(parsed);
              scheduleSave();
              render();
            }
          } catch (err) { alert("Couldn't read file: " + (err && err.message ? err.message : err)); }
        };
        reader.readAsText(file);
        input.value = '';
      },

      stopProp: function(e) { e.stopPropagation(); },
    };

    // =========================================================================
    // RENDER FUNCTIONS
    // =========================================================================
    function renderApp() {
      var body;
      if (STATE.activeDay === 'plan') {
        body = renderPlan();
      } else {
        var day = findDay(STATE.activeDay);
        var accent = TYPE_COLORS[day.type];
        body = renderDayHeader(day, accent);
        if (day.type === 'cardio') body += renderCardio(day, accent);
        else if (day.type === 'recovery') body += renderRecovery(day, accent);
        else body += renderLiftDay(day, accent);
      }
      return '<div class="app">' +
        renderHeader() +
        body +
        (STATE.exportText !== null ? renderModal() : '') +
      '</div>';
    }

    function renderHeader() {
      var today = todayDayId();
      var tabs = DAY_ORDER.slice(1).concat(['sun']).map(function(id) {
        var d = findDay(id);
        var active = id === STATE.activeDay;
        var c = TYPE_COLORS[d.type];
        var style = active ? 'background:' + c + ';color:#fff;border-color:' + c + ';' : '';
        return '<button class="tab' + (active ? ' active' : '') + '" style="' + style + '" onclick="app.setActiveDay(\'' + id + '\')">' +
          esc(tabLabel(d)) + (id === today ? '<span class="today-dot"></span>' : '') + '</button>';
      }).join('');
      var planActive = STATE.activeDay === 'plan';
      tabs += '<button class="tab' + (planActive ? ' active' : '') + '" style="' + (planActive ? 'background:#111;color:#fff;border-color:#111;' : '') + '" onclick="app.setActiveDay(\'plan\')">PLAN</button>';

      return '<div class="header">' +
        '<div class="header-row">' +
          '<div>' +
            '<div class="brand">TROY PROGRAM</div>' +
            '<div class="title">WORKOUT LOG</div>' +
            '<div id="save-status" class="save-tag">● SYNCED</div>' +
          '</div>' +
          '<div class="header-btns">' +
            '<button class="header-btn" onclick="app.exportData()">EXPORT</button>' +
            '<button class="header-btn" onclick="app.triggerImport()">IMPORT</button>' +
            '<input id="import-input" type="file" accept="application/json,.json" onchange="app.handleImport(this)" style="display:none">' +
          '</div>' +
        '</div>' +
        '<div class="tabs">' + tabs + '</div>' +
      '</div>';
    }

    function renderDayHeader(day, accent) {
      var right = '';
      if (day.exercises) {
        var totalSets = day.exercises.reduce(function(a, e){ return a + e.sets.length; }, 0);
        right = '<div class="day-set-count">' + totalSets + ' SETS</div>';
      } else if (day.type === 'cardio') {
        right = '<div class="day-set-count">' + (num(day.cardio.min) || 0) + ' MIN</div>';
      }
      return '<div class="day-section">' +
        '<div class="day-header">' +
          '<div class="day-label">' + esc(tabLabel(day)) + '</div>' +
          '<div style="flex:1"></div>' + right +
        '</div>' +
        '<div class="day-focus">' + esc(day.focus) + '</div>' +
      '</div>';
    }

    function renderLogButton(day, accent, label) {
      var done = loggedOn(day.id, todayISO());
      if (done) {
        return '<div class="panel" style="text-align:center">' +
          '<div class="done-chip">✓ LOGGED ' + shortDate(todayISO()) + '</div>' +
          '<div style="display:flex;gap:8px;margin-top:10px">' +
            '<button class="primary-btn" style="background:' + accent + '" onclick="app.logSession(\'' + day.id + '\')">UPDATE LOG</button>' +
            '<button class="secondary-btn" onclick="app.unlogSession(\'' + day.id + '\')">UNDO</button>' +
          '</div>' +
        '</div>';
      }
      return '<button class="primary-btn wide-btn" style="background:' + accent + '" onclick="app.logSession(\'' + day.id + '\')">' + label + '</button>';
    }

    function renderLiftDay(day, accent) {
      return '<div class="ex-list">' +
        day.exercises.map(function(e, i) { return renderExercise(e, i, accent, day.id); }).join('') +
        renderAddArea(accent, day.id) +
        '<div class="panel">' +
          '<div class="panel-label">NOTES</div>' +
          '<textarea class="notes-input" placeholder="How did it feel? Form cues, machine settings, adjustments..." oninput="app.setNotes(\'' + day.id + '\',this.value)">' + esc(day.notes) + '</textarea>' +
        '</div>' +
        renderLogButton(day, accent, '✓ LOG TODAY\'S WORKOUT') +
      '</div>';
    }

    function renderExercise(e, idx, accent, dayId) {
      var prog = getProgression(e);

      var nameSection;
      if (STATE.editingName === e.id) {
        nameSection = '<input class="ex-name-input" autofocus value="' + esc(e.name) + '" ' +
          'style="border-color:' + accent + '99" ' +
          'onblur="app.finishEditName(\'' + dayId + '\',\'' + e.id + '\',this.value)" ' +
          'onkeydown="app.handleKeyOnEdit(event)">';
      } else {
        nameSection = '<div class="ex-name" onclick="app.startEditName(\'' + e.id + '\')">' + esc(e.name) + '</div>';
      }

      var restSec = e.c ? REST_COMPOUND : REST_ISOLATION;
      var last = lastLogFor(e.id);
      var lastText = last
        ? 'LAST ' + shortDate(last.date) + ': ' + last.sets.map(function(s){ return (num(s.w) ? s.w + '×' : '') + s.r; }).join(', ')
        : '';

      var rxSection = '<div class="rx-row">' +
        '<span class="rx">' + esc(e.rx) + '</span>' +
        '<button class="rest-btn" onclick="app.startRest(' + restSec + ')">⏱ ' + fmtClock(restSec) + '</button>' +
        (lastText ? '<span class="last">' + esc(lastText) + '</span>' : '') +
      '</div>';

      var targetSection = '';
      if (prog) {
        var st = prog.ready
          ? { bg: '#e6f5ec', color: '#0e7c47', border: '#9ed4b3', label: '↑ READY:' }
          : { bg: '#faf7f2', color: '#666',    border: '#ece7de', label: '↗ TARGET:' };
        targetSection = '<div class="target-banner" style="background:' + st.bg + ';color:' + st.color + ';border-color:' + st.border + '">' +
          '<span class="label">' + st.label + '</span>' +
          '<span class="val">' + esc(prog.text) + '</span>' +
          '<span class="hint">' + esc(prog.hint) + '</span>' +
        '</div>';
      }

      var gp = goalProgress(e);
      var goalSection = '<div class="goal-row" onclick="app.editGoal(\'' + dayId + '\',\'' + e.id + '\')">';
      if (gp) {
        var status = gp.pct >= 100 ? '✓ GOAL HIT' : gp.pct + '% · ' + (100 - gp.pct) + '% TO GO';
        goalSection += '<div class="goal-top"><span>GOAL: ' + esc(goalText(e)) + '</span>' +
          '<span class="pct" style="color:' + goalColor(gp.pct) + '">' + status + '</span></div>' + goalBar(gp.pct);
      } else {
        goalSection += '<div class="goal-set">+ SET GOAL</div>';
      }
      goalSection += '</div>';

      var weightHead = e.bw ? 'ADDED (LBS)' : 'WEIGHT' + (e.unit ? ' / ' + e.unit : ' (LBS)');
      var setsHtml = e.sets.map(function(set, si) {
        var bordered = si === e.sets.length - 1 ? '' : ' bordered';
        var weightVal = (num(set.w) === 0 && (e.bw || set.w === '' || e.rx.indexOf('Machine-dependent') !== -1)) ? '' : esc(set.w);
        var weightPlaceholder = e.bw ? 'BW' : (e.rx.indexOf('Machine-dependent') !== -1 ? 'LBS' : '0');
        var focusAttr = 'onfocus="this.style.borderColor=\'' + accent + '\';this.style.boxShadow=\'0 0 0 2px ' + accent + '22\'" ' +
          'onblur="this.style.borderColor=\'#e0d9cc\';this.style.boxShadow=\'none\';app.refreshAfterEdit()" ';
        return '<div class="set-row' + bordered + '">' +
          '<div class="set-num" style="color:' + accent + '">' + (si + 1) + '</div>' +
          '<input class="num-input" type="number" inputmode="decimal" step="any" value="' + weightVal + '" placeholder="' + weightPlaceholder + '" ' + focusAttr +
            'oninput="app.updateSet(\'' + dayId + '\',\'' + e.id + '\',' + si + ',\'w\',this.value)">' +
          '<input class="num-input" type="number" inputmode="numeric" value="' + esc(set.r) + '" ' + focusAttr +
            'oninput="app.updateSet(\'' + dayId + '\',\'' + e.id + '\',' + si + ',\'r\',this.value)">' +
          '<button class="remove-set-btn" onclick="app.removeSet(\'' + dayId + '\',\'' + e.id + '\',' + si + ')">−</button>' +
        '</div>';
      }).join('');

      return '<div class="card">' +
        '<div class="ex-header">' +
          '<div class="ex-num">' + String(idx + 1).padStart(2, '0') + '</div>' +
          nameSection +
          '<button class="icon-btn" onclick="app.removeExercise(\'' + dayId + '\',\'' + e.id + '\')">×</button>' +
        '</div>' +
        rxSection +
        targetSection +
        goalSection +
        '<div class="col-headers">' +
          '<div class="h1">SET</div>' +
          '<div class="h">' + weightHead + '</div>' +
          '<div class="h">REPS</div>' +
          '<div></div>' +
        '</div>' +
        setsHtml +
        '<div class="add-set-wrap">' +
          '<button class="add-set-btn" onclick="app.addSet(\'' + dayId + '\',\'' + e.id + '\')">+ ADD SET</button>' +
        '</div>' +
      '</div>';
    }

    function renderAddArea(accent, dayId) {
      if (STATE.adding) {
        return '<div class="new-ex-card" style="border-color:' + accent + '66">' +
          '<div class="new-ex-label" style="color:' + accent + '">NEW EXERCISE</div>' +
          '<input class="new-ex-input" autofocus value="' + esc(STATE.newExName) + '" placeholder="Exercise name..." ' +
            'style="border-color:' + accent + '99" ' +
            'oninput="app.setNewExName(this.value)" ' +
            'onkeydown="app.handleKeyOnAdd(event,\'' + dayId + '\')">' +
          '<div class="new-ex-buttons">' +
            '<button class="primary-btn" style="background:' + accent + '" onclick="app.submitAdd(\'' + dayId + '\')">ADD</button>' +
            '<button class="secondary-btn" onclick="app.cancelAdd()">CANCEL</button>' +
          '</div>' +
        '</div>';
      }
      return '<button class="add-ex-btn" onclick="app.startAdd()">+ ADD EXERCISE</button>';
    }

    function renderCardio(day, accent) {
      var c = day.cardio;
      var last = lastCardioFor(day.id);
      var lastText = last
        ? 'LAST ' + shortDate(last.date) + ': ' + last.cardio.mph + ' MPH · ' + last.cardio.incline + '% · ' + last.cardio.min + ' MIN'
        : '';
      function input(field, mode) {
        return '<input class="num-input" type="number" inputmode="' + mode + '" step="any" value="' + esc(c[field]) + '" ' +
          'onfocus="this.style.borderColor=\'' + accent + '\';this.style.boxShadow=\'0 0 0 2px ' + accent + '22\'" ' +
          'onblur="this.style.borderColor=\'#e0d9cc\';this.style.boxShadow=\'none\';app.refreshAfterEdit()" ' +
          'oninput="app.updateCardio(\'' + day.id + '\',\'' + field + '\',this.value)">';
      }
      return '<div class="ex-list">' +
        '<div class="card">' +
          '<div class="ex-header"><div class="ex-name">Treadmill Incline Walking</div></div>' +
          (lastText ? '<div class="rx-row"><span class="last" style="margin-left:0;text-align:left">' + esc(lastText) + '</span></div>' : '') +
          '<div class="cardio-head"><div>SPEED (MPH)</div><div>INCLINE (%)</div><div>MINUTES</div></div>' +
          '<div class="cardio-row">' + input('mph', 'decimal') + input('incline', 'decimal') + input('min', 'numeric') + '</div>' +
        '</div>' +
        renderLogButton(day, accent, '✓ LOG CARDIO') +
      '</div>';
    }

    function renderRecovery(day, accent) {
      return '<div class="ex-list">' +
        '<div class="panel">' +
          '<div class="panel-label">TODAY</div>' +
          '<ul class="list"><li>Rest or easy walking</li><li>Light stretching or mobility if desired</li></ul>' +
        '</div>' +
        renderLogButton(day, accent, '✓ MARK RECOVERY DONE') +
      '</div>';
    }

    function renderPlan() {
      var monday = mondayOf(new Date());
      // One cell per workout, ticked if it was logged any day this week (Mon-Sun),
      // so it works whichever day you actually did it. The next workout is outlined.
      var weekStart = isoDate(monday);
      var weekEnd = isoDate(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6));
      var upNext = nextDayId() || todayDayId();
      var weekCells = STATE.data.days.map(function(d) {
        var logs = STATE.data.history.filter(function(h) {
          return h.dayId === d.id && h.date >= weekStart && h.date <= weekEnd;
        });
        var lastDate = logs.length ? logs[logs.length - 1].date : null;
        var c = TYPE_COLORS[d.type];
        return '<div class="week-cell' + (d.id === upNext ? ' next' : '') + '" onclick="app.setActiveDay(\'' + d.id + '\')">' +
          '<div class="d" style="color:' + c + '">' + esc(tabLabel(d)) + '</div>' +
          '<div class="c">' + (lastDate ? '✓ ' + shortDate(lastDate) : '') + '</div>' +
        '</div>';
      }).join('');

      var w = STATE.weekDraft || blankWeekDraft();
      function field(key, label, type, ph) {
        return '<div class="field"><label>' + label + '</label>' +
          '<input type="' + (type || 'text') + '" value="' + esc(w[key]) + '" placeholder="' + esc(ph || '') + '" ' +
          (type === 'number' ? 'inputmode="decimal" step="any" ' : '') +
          'oninput="app.setWeekField(\'' + key + '\',this.value)"></div>';
      }

      var weeksHtml = STATE.data.weeks.length
        ? STATE.data.weeks.map(function(x) {
            function row(k, v) { return v ? '<div><span class="entry-k">' + k + ':</span> ' + esc(v) + '</div>' : ''; }
            return '<div class="entry">' +
              '<div class="entry-head"><span>WEEK OF ' + esc(shortDate(x.weekOf)) + '</span>' +
                '<span><button class="icon-btn" style="font-size:10px;font-weight:800;letter-spacing:1px" onclick="app.editWeek(\'' + esc(x.weekOf) + '\')">EDIT</button>' +
                '<button class="icon-btn" onclick="app.deleteWeek(\'' + esc(x.weekOf) + '\')">×</button></span></div>' +
              row('BODY WEIGHT', x.bodyWeight ? x.bodyWeight + ' lb' : '') +
              row('WAIST', x.waist ? x.waist + ' in' : '') +
              row('STRENGTH', x.strength) +
              row('ENERGY / RECOVERY', x.energy) +
              row('ADJUSTMENTS', x.adjustments) +
            '</div>';
          }).join('')
        : '<div class="empty">No weeks logged yet.</div>';

      var recent = STATE.data.history.slice(-8).reverse();
      var recentHtml = recent.length
        ? recent.map(function(h) {
            return '<div class="entry"><div class="entry-head"><span>' + esc(h.label) + '</span><span class="entry-k">' + shortDate(h.date) + '</span></div></div>';
          }).join('')
        : '<div class="empty">Nothing logged yet. Tap “LOG” at the bottom of each day.</div>';

      return '<div class="day-section">' +
          '<div class="day-header"><div class="day-label">TROY PLAN</div></div>' +
          '<div class="day-focus">Lean · Muscular · Athletic · Defined</div>' +
        '</div>' +
        '<div class="ex-list">' +
          '<div class="panel">' +
            '<div class="panel-label">THIS WEEK · 4 LIFT + 2 CARDIO + 1 RECOVERY</div>' +
            '<div style="font-size:9px;color:#888;margin:-4px 0 10px">RED OUTLINE = UP NEXT</div>' +
            '<div class="week-grid">' + weekCells + '</div>' +
          '</div>' +
          '<div class="panel" id="week-form">' +
            '<div class="panel-label">WEEKLY PROGRESS TRACKER</div>' +
            '<div class="field-row">' +
              field('weekOf', 'WEEK OF', 'date') +
              field('bodyWeight', 'BODY WEIGHT (LB)', 'number', '175') +
            '</div>' +
            field('waist', 'WAIST (IN)', 'number', '32') +
            field('strength', 'STRENGTH IMPROVEMENTS', 'text', 'Bench 105 → 110...') +
            field('energy', 'ENERGY / RECOVERY', 'text', 'Good / tired / sore...') +
            field('adjustments', 'ADJUSTMENTS FOR NEXT WEEK', 'text', '') +
            '<button class="primary-btn wide-btn" style="background:#111" onclick="app.saveWeek()">SAVE WEEK</button>' +
            '<div style="margin-top:14px">' + weeksHtml + '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-label">TRAINING RULES</div>' +
            '<ul class="list">' + TRAINING_RULES.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-label">RECENT SESSIONS</div>' + recentHtml +
          '</div>' +
          '<button class="secondary-btn wide-btn" onclick="app.resetPlan()">RESET WEIGHTS TO PLAN DEFAULTS</button>' +
        '</div>';
    }

    function renderModal() {
      var copyLabel = STATE.copyStatus === 'copied' ? '✓ COPIED TO CLIPBOARD' :
                      STATE.copyStatus === 'failed' ? '✕ COPY FAILED — SELECT MANUALLY' :
                      '📋 COPY BACKUP';
      var copyBg = STATE.copyStatus === 'copied' ? '#0e9f6e' :
                   STATE.copyStatus === 'failed' ? '#d63b1f' : '#111';

      return '<div class="overlay" onclick="app.closeModal()">' +
        '<div class="modal" onclick="app.stopProp(event)">' +
          '<div class="modal-header">' +
            '<div>' +
              '<div style="font-size:9px;letter-spacing:3px;color:#888;margin-bottom:2px">BACKUP</div>' +
              '<div style="font-size:16px;font-weight:900;letter-spacing:2px;color:#111">EXPORT DATA</div>' +
            '</div>' +
            '<button class="modal-close" onclick="app.closeModal()">×</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<p class="modal-help">A file download was attempted. If it didn\'t appear in your Files app, tap <b>COPY</b> below and paste into Notes or Mail to back up.</p>' +
            '<button class="primary-btn copy-btn" style="background:' + copyBg + '" onclick="app.copyExport()">' + copyLabel + '</button>' +
            '<div style="font-size:9px;letter-spacing:1px;color:#888;margin-bottom:6px;font-weight:700">OR LONG-PRESS THE TEXT BELOW → SELECT ALL → COPY</div>' +
            '<textarea id="export-textarea" class="export-textarea" readonly onfocus="this.select()">' + esc(STATE.exportText) + '</textarea>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    // =========================================================================
    // RENDER
    // =========================================================================
    function render() {
      var root = document.getElementById('root');
      root.innerHTML = renderApp();
      updateSaveIndicator();
      var af = root.querySelector('[autofocus]');
      if (af) af.focus();
    }

    // Polyfill for older Safari
    if (!String.prototype.padStart) {
      String.prototype.padStart = function(n, c) {
        var s = String(this); c = c || ' ';
        while (s.length < n) s = c + s;
        return s;
      };
    }

    // =========================================================================
    // INIT
    // =========================================================================
    // Open on the workout after the most recently logged one (latest date, then
    // latest log time), following the plan order and wrapping CARDIO 2 -> UPPER A.
    // Falls back to today's scheduled workout if nothing has been logged yet.
    function lastLoggedDayId() {
      var best = null;
      STATE.data.history.forEach(function(h, i) {
        var key = [h.date, h.at || 0, i];
        if (!findDay(h.dayId)) return;
        if (!best || key[0] > best.key[0] || (key[0] === best.key[0] && (key[1] > best.key[1] || (key[1] === best.key[1] && key[2] > best.key[2])))) {
          best = { key: key, dayId: h.dayId };
        }
      });
      return best ? best.dayId : null;
    }
    function nextDayId() {
      var last = lastLoggedDayId();
      if (!last) return null;
      var days = STATE.data.days;
      var i = days.findIndex(function(d){ return d.id === last; });
      return days[(i + 1) % days.length].id;
    }
    STATE.activeDay = nextDayId() || todayDayId();
    render();
  </script>
</body>
</html>
